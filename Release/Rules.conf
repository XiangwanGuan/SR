[General]
compatibility-mode = 3
ipv6 = true
tun-excluded-routes = 10.0.0.0/8,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.168.0.0/16,224.0.0.0/4,255.255.255.255/32,ff02::fb/128
dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query
fallback-dns-server = system
hijack-dns = *:53
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT
icmp-auto-reply = true
private-ip-answer = true

[Rule]
RULE-SET,https://raw.githubusercontent.com/XiangwanGuan/SR/main/Rulesets/Private.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/XiangwanGuan/SR/main/Rulesets/Direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/XiangwanGuan/SR/main/Rulesets/Proxy.list,PROXY
GEOIP,CN,DIRECT
FINAL,PROXY

[Host]
localhost = 127.0.0.1
